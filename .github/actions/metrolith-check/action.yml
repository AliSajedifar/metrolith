{
  "name": "Metrolith check",
  "description": "Evaluate one persisted Metrolith run with one policy and emit deterministic SARIF",
  "inputs": {
    "run": {
      "description": "Path to an existing persisted Metrolith run directory",
      "required": true
    },
    "policy": {
      "description": "Path to a Policy v1 or Policy v2 JSON document",
      "required": true
    },
    "protected-required": {
      "description": "Require an independently hosted full-commit-SHA Action plus externally authenticated Policy/evidence inputs. Local ./ Action use is refused in this mode.",
      "required": false,
      "default": "false"
    },
    "policy-sha256": {
      "description": "Owner-controlled lowercase SHA-256 of the exact Policy bytes; required in protected mode",
      "required": false,
      "default": ""
    },
    "evaluator-repository": {
      "description": "Expected independently protected owner/repository from workflow configuration",
      "required": false,
      "default": ""
    },
    "evaluator-revision": {
      "description": "Expected full 40-hex Action commit SHA from workflow configuration",
      "required": false,
      "default": ""
    },
    "evaluator-source-sha256": {
      "description": "Expected reviewed evaluator source-set SHA-256",
      "required": false,
      "default": ""
    },
    "evidence-receipt": {
      "description": "Optional canonical owner-controlled trusted-evidence receipt",
      "required": false,
      "default": ""
    },
    "evidence-receipt-sha256": {
      "description": "Owner-controlled lowercase SHA-256 of the exact trusted-evidence receipt bytes",
      "required": false,
      "default": ""
    },
    "hotspots": {
      "description": "Optional path to an EXISTING metrolith hotspots JSON document, passed through to metrolith check as evidence. The action never runs hotspot analysis and never reads this file; leaving it unset changes nothing.",
      "required": false,
      "default": ""
    },
    "duplication": {
      "description": "Optional path to an EXISTING metrolith duplication JSON document, passed through to metrolith check as evidence. The action never runs duplication analysis and never opens this file; leaving it unset changes nothing. Produce the document in an earlier workflow step with `metrolith duplication`.",
      "required": false,
      "default": ""
    },
    "baseline": {
      "description": "Optional workspace-contained Ratchet Baseline 1.0 path passed unchanged to metrolith check. The action never opens this file. Its BASELINE.source-run trust bundle must already exist.",
      "required": false,
      "default": ""
    },
    "baseline-sha256": {
      "description": "Externally trusted lowercase SHA-256 passed unchanged to metrolith check with baseline. The action does not calculate or verify it.",
      "required": false,
      "default": ""
    },
    "baseline-origin": {
      "description": "Provenance of staged baseline bytes: protected_base_revision, owner_controlled_artifact, candidate_workspace, or local_file. Pull requests default to candidate_workspace; other events default to local_file.",
      "required": false,
      "default": ""
    },
    "baseline-required": {
      "description": "Require a configured protected baseline origin. Candidate-workspace and local-file origins are refused.",
      "required": false,
      "default": "false"
    },
    "sarif": {
      "description": "Workspace-relative path for deterministic Metrolith SARIF",
      "required": false,
      "default": "metrolith-results/metrolith.sarif"
    },
    "upload-sarif": {
      "description": "Upload SARIF to GitHub code scanning when safe and explicitly enabled",
      "required": false,
      "default": "false"
    }
  },
  "outputs": {
    "exit-code": {
      "description": "Metrolith check exit: 0 pass, 1 gate failure, 2 evaluation/integration error",
      "value": "${{ steps.check.outputs.exit-code }}"
    },
    "verdict": {
      "description": "Metrolith verdict: pass, fail, or error",
      "value": "${{ steps.check.outputs.verdict }}"
    },
    "sarif-path": {
      "description": "Workspace-relative path to unchanged Metrolith SARIF",
      "value": "${{ steps.check.outputs.sarif-path }}"
    },
    "sarif-created": {
      "description": "Whether a fresh, internally consistent SARIF file was created",
      "value": "${{ steps.check.outputs.sarif-created }}"
    },
    "sarif-sha256": {
      "description": "SHA-256 of the unchanged Metrolith SARIF bytes",
      "value": "${{ steps.check.outputs.sarif-sha256 }}"
    },
    "evaluator-protection": {
      "description": "protected, local-unprotected, or not-verified",
      "value": "${{ steps.check.outputs.evaluator-protection }}"
    },
    "finding-count": {
      "description": "Canonical finding count copied from Metrolith SARIF metadata",
      "value": "${{ steps.check.outputs.finding-count }}"
    },
    "violation-count": {
      "description": "Violation-severity count copied from Metrolith SARIF metadata",
      "value": "${{ steps.check.outputs.violation-count }}"
    },
    "warning-count": {
      "description": "Warning-severity count copied from Metrolith SARIF metadata",
      "value": "${{ steps.check.outputs.warning-count }}"
    },
    "info-count": {
      "description": "Info-severity count copied from Metrolith SARIF metadata",
      "value": "${{ steps.check.outputs.info-count }}"
    },
    "upload-eligible": {
      "description": "Whether the explicitly requested upload is safe for this event",
      "value": "${{ steps.check.outputs.upload-eligible }}"
    },
    "upload-reason": {
      "description": "eligible, disabled, fork-pull-request, or integration-error",
      "value": "${{ steps.check.outputs.upload-reason }}"
    },
    "upload-outcome": {
      "description": "GitHub upload step outcome; empty/skipped when upload did not run",
      "value": "${{ steps.upload.outcome }}"
    }
  },
  "runs": {
    "using": "composite",
    "steps": [
      {
        "name": "Set up supported Python 3.13 (actions/setup-python v6.3.0)",
        "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
        "with": {
          "python-version": "3.13.9",
          "cache": "pip",
          "cache-dependency-path": "${{ github.action_path }}/../../../requirements/action-runtime.lock"
        }
      },
      {
        "name": "Enforce event security boundary",
        "shell": "bash",
        "run": "python \"$GITHUB_ACTION_PATH/metrolith_action.py\" preflight",
        "env": {
          "METROLITH_PROTECTED_REQUIRED": "${{ inputs.protected-required }}",
          "METROLITH_ACTION_REPOSITORY": "${{ github.action_repository }}",
          "METROLITH_ACTION_REF": "${{ github.action_ref }}",
          "METROLITH_EXPECTED_EVALUATOR_REPOSITORY": "${{ inputs.evaluator-repository }}",
          "METROLITH_EXPECTED_EVALUATOR_REVISION": "${{ inputs.evaluator-revision }}",
          "METROLITH_EXPECTED_EVALUATOR_SOURCE_SHA256": "${{ inputs.evaluator-source-sha256 }}"
        }
      },
      {
        "name": "Install checked-out Metrolith source",
        "shell": "bash",
        "run": "python \"$GITHUB_ACTION_PATH/metrolith_action.py\" install",
        "env": {
          "METROLITH_PROTECTED_REQUIRED": "${{ inputs.protected-required }}",
          "METROLITH_ACTION_REPOSITORY": "${{ github.action_repository }}",
          "METROLITH_ACTION_REF": "${{ github.action_ref }}",
          "METROLITH_EXPECTED_EVALUATOR_REPOSITORY": "${{ inputs.evaluator-repository }}",
          "METROLITH_EXPECTED_EVALUATOR_REVISION": "${{ inputs.evaluator-revision }}",
          "METROLITH_EXPECTED_EVALUATOR_SOURCE_SHA256": "${{ inputs.evaluator-source-sha256 }}"
        }
      },
      {
        "name": "Run Metrolith check once",
        "id": "check",
        "continue-on-error": true,
        "shell": "bash",
        "run": "python \"$GITHUB_ACTION_PATH/metrolith_action.py\" check",
        "env": {
          "METROLITH_RUN": "${{ inputs.run }}",
          "METROLITH_POLICY": "${{ inputs.policy }}",
          "METROLITH_PROTECTED_REQUIRED": "${{ inputs.protected-required }}",
          "METROLITH_POLICY_SHA256": "${{ inputs.policy-sha256 }}",
          "METROLITH_ACTION_REPOSITORY": "${{ github.action_repository }}",
          "METROLITH_ACTION_REF": "${{ github.action_ref }}",
          "METROLITH_EXPECTED_EVALUATOR_REPOSITORY": "${{ inputs.evaluator-repository }}",
          "METROLITH_EXPECTED_EVALUATOR_REVISION": "${{ inputs.evaluator-revision }}",
          "METROLITH_EXPECTED_EVALUATOR_SOURCE_SHA256": "${{ inputs.evaluator-source-sha256 }}",
          "METROLITH_EVIDENCE_RECEIPT": "${{ inputs.evidence-receipt }}",
          "METROLITH_EVIDENCE_RECEIPT_SHA256": "${{ inputs.evidence-receipt-sha256 }}",
          "METROLITH_HOTSPOTS": "${{ inputs.hotspots }}",
          "METROLITH_DUPLICATION": "${{ inputs.duplication }}",
          "METROLITH_BASELINE": "${{ inputs.baseline }}",
          "METROLITH_BASELINE_SHA256": "${{ inputs.baseline-sha256 }}",
          "METROLITH_BASELINE_ORIGIN": "${{ inputs.baseline-origin }}",
          "METROLITH_BASELINE_REQUIRED": "${{ inputs.baseline-required }}",
          "METROLITH_SARIF": "${{ inputs.sarif }}",
          "METROLITH_UPLOAD_SARIF": "${{ inputs.upload-sarif }}"
        }
      },
      {
        "name": "Upload unchanged Metrolith SARIF (github/codeql-action v4.37.7)",
        "id": "upload",
        "if": "${{ steps.check.outputs.upload-eligible == 'true' && steps.check.outputs.sarif-created == 'true' }}",
        "uses": "github/codeql-action/upload-sarif@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c",
        "with": {
          "sarif_file": "${{ steps.check.outputs.sarif-path }}",
          "category": "metrolith"
        }
      },
      {
        "name": "Verify SARIF bytes remain unchanged",
        "if": "${{ always() && steps.check.outputs.sarif-created == 'true' }}",
        "shell": "bash",
        "run": "python \"$GITHUB_ACTION_PATH/metrolith_action.py\" verify",
        "env": {
          "METROLITH_SARIF": "${{ steps.check.outputs.sarif-path }}",
          "METROLITH_EXPECTED_SHA256": "${{ steps.check.outputs.sarif-sha256 }}"
        }
      },
      {
        "name": "Propagate Metrolith result",
        "if": "${{ always() }}",
        "shell": "bash",
        "run": "python \"$GITHUB_ACTION_PATH/metrolith_action.py\" propagate",
        "env": {
          "METROLITH_EXIT_CODE": "${{ steps.check.outputs.exit-code }}"
        }
      }
    ]
  }
}
