name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: requirements/release-verification.lock
      - name: Install locked verification environment
        run: |
          python -m pip install --require-hashes -r requirements/release-verification.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify release candidate without publishing
        run: >-
          python tools/release_verify.py
          --output "${{ runner.temp }}/release-evidence-${{ runner.os }}.json"
      - name: Preserve release-verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ runner.os }}
          path: ${{ runner.temp }}/release-evidence-${{ runner.os }}.json
          if-no-files-found: error
